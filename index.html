<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Djenné 360° AR</title>
  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.6.2/dist/aframe.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    #controls { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:999; display:flex; gap:8px; align-items:center; background:rgba(0,0,0,0.7); padding:10px 15px; border-radius:30px; color:white; font-family:system-ui; }
    #controls button { background:#fff; border:none; border-radius:50%; width:40px; height:40px; font-size:18px; cursor:pointer; }
    #seek { width:180px; accent-color:#fff; }
    #time { font-size:12px; min-width:70px; text-align:center; }
    #debug { position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:9999; background:rgba(0,0,0,0.9); color:#0f0; padding:10px 15px; border-radius:8px; font-family:monospace; font-size:12px; max-width:90%; text-align:center; }
    #enter-ar-btn { position:fixed; bottom:90px; left:50%; transform:translateX(-50%); z-index:999; background:#4285f4; color:white; border:none; padding:12px 24px; border-radius:8px; font-size:16px; cursor:pointer; display:none; }
  </style>
</head>
<body style="margin:0; overflow:hidden;">
  <a-scene id="scene">
    <a-assets>
      <video id="video360" src="video.mp4" poster="poster.jpg" loop muted playsinline crossorigin="anonymous" preload="metadata"></video>
    </a-assets>
    <a-videosphere id="sphere" src="#video360" rotation="0 180 0"></a-videosphere>
    <a-camera id="camera" position="0 1.6 0" look-controls="enabled: true"></a-camera>
  </a-scene>

  <div id="debug"></div>
  <button id="enter-ar-btn">Entrer en AR</button>

  <div id="controls" style="display:flex;">
    <button id="btnPlay" onclick="v.play()">▶</button>
    <button id="btnPause" onclick="v.pause()">⏸</button>
    <button onclick="v.currentTime=0; v.play()">⏮</button>
    <input type="range" id="seek" min="0" max="60" step="1" value="0" oninput="v.currentTime=this.value">
    <span id="time">0:00 / 1:00</span>
  </div>

  <script>
    const v = document.getElementById('video360');
    const seek = document.getElementById('seek');
    const timeEl = document.getElementById('time');
    const btnPlay = document.getElementById('btnPlay');
    const btnPause = document.getElementById('btnPause');
    const controls = document.getElementById('controls');
    const scene = document.getElementById('scene');
    const sphere = document.getElementById('sphere');
    const debug = document.getElementById('debug');
    const enterARBtn = document.getElementById('enter-ar-btn');

    function log(msg) {
      console.log('[AR]', msg);
      debug.textContent = msg;
    }

    v.addEventListener('loadedmetadata', () => { 
      seek.max = v.duration; 
      log('Vidéo chargée: ' + v.videoWidth + 'x' + v.videoHeight + ' ' + v.duration.toFixed(1) + 's');
    });
    v.addEventListener('canplay', () => log('Vidéo prête (canplay)'));
    v.addEventListener('play', () => log('Vidéo play'));
    v.addEventListener('error', (e) => log('Erreur vidéo: ' + (v.error?.code || '?') + ' ' + (v.error?.message || '')));
    v.addEventListener('timeupdate', () => {
      seek.value = v.currentTime;
      const c = v.currentTime, d = v.duration;
      timeEl.textContent = `${Math.floor(c/60)}:${String(Math.floor(c)%60).padStart(2,'0')} / ${Math.floor(d/60)}:${String(Math.floor(d)%60).padStart(2,'0')}`;
      btnPlay.style.display = v.paused ? 'block' : 'none';
      btnPause.style.display = v.paused ? 'none' : 'block';
    });

    // Check WebXR support
    let webxrSupported = false;
    if (navigator.xr) {
      navigator.xr.isSessionSupported('immersive-ar').then(supported => {
        webxrSupported = supported;
        log('WebXR AR: ' + (supported ? 'SUPPORTÉ ✓' : 'NON SUPPORTÉ'));
        if (supported) enterARBtn.style.display = 'block';
      }).catch(e => log('WebXR check failed: ' + e.message));
    } else {
      log('WebXR non disponible');
    }

    // Force video load and play
    v.load();
    v.play().catch(e => log('Autoplay blocked: ' + e.message));

    // Enter AR button click
    enterARBtn.addEventListener('click', async () => {
      enterARBtn.disabled = true;
      enterARBtn.textContent = 'Chargement...';
      log('Demande session AR...');

      try {
        scene.setAttribute('webxr', 'requiredFeatures: local-floor; optionalFeatures: hit-test;');
        const webxr = scene.components.webxr;
        if (webxr && typeof webxr.enterAR === 'function') {
          await webxr.enterAR();
        } else if (typeof scene.enterAR === 'function') {
          await scene.enterAR();
        } else {
          throw new Error('enterAR non disponible');
        }
        log('Session AR démarrée');
        controls.style.display = 'flex';
      } catch (e) {
        console.error('AR session failed:', e);
        log('Erreur AR: ' + e.message);
        enterARBtn.disabled = false;
        enterARBtn.textContent = 'Réessayer';
      }
    });

    scene.addEventListener('exit-vr', () => {
      log('Session AR terminée');
      enterARBtn.disabled = false;
      enterARBtn.textContent = 'Entrer en AR';
    });
  </script>
</body>
</html>
