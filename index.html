<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Djenné 360° AR - Universal</title>
  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.6.2/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160/build/three.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { overflow:hidden; background:#000; }
    #app { width:100vw; height:100vh; position:relative; }
    #camera-video { position:fixed; top:0; left:0; width:100vw; height:100vh; object-fit:cover; z-index:1; display:none; }
    #canvas { position:fixed; top:0; left:0; z-index:2; }
    #controls { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:10; display:flex; gap:8px; align-items:center; background:rgba(0,0,0,0.7); padding:10px 15px; border-radius:30px; color:white; font-family:system-ui; }
    #controls button { background:#fff; border:none; border-radius:50%; width:40px; height:40px; font-size:18px; cursor:pointer; }
    #seek { width:180px; accent-color:#fff; }
    #time { font-size:12px; min-width:70px; text-align:center; }
    #status { position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:10; background:rgba(0,0,0,0.8); color:#0f0; padding:10px 15px; border-radius:8px; font-family:monospace; font-size:12px; max-width:90%; text-align:center; }
    #enter-ar-btn { position:fixed; bottom:90px; left:50%; transform:translateX(-50%); z-index:10; background:#4285f4; color:white; border:none; padding:12px 24px; border-radius:8px; font-size:16px; cursor:pointer; display:none; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <div id="app">
    <video id="camera-video" playsinline muted></video>
    <canvas id="canvas"></canvas>
    
    <div id="status"></div>
    <button id="enter-ar-btn">Entrer en AR</button>
    
    <div id="controls">
      <button id="btnPlay" onclick="videoEl.play()">▶</button>
      <button id="btnPause" onclick="videoEl.pause()">⏸</button>
      <button onclick="videoEl.currentTime=0; videoEl.play()">⏮</button>
      <input type="range" id="seek" min="0" max="60" step="1" value="0" oninput="videoEl.currentTime=this.value">
      <span id="time">0:00 / 1:00</span>
    </div>
  </div>

  <script>
    const videoEl = document.getElementById('video360') || (() => {
      const v = document.createElement('video');
      v.id = 'video360';
      v.src = 'video.mp4';
      v.poster = 'poster.jpg';
      v.loop = true;
      v.muted = true;
      v.playsInline = true;
      v.crossOrigin = 'anonymous';
      v.preload = 'metadata';
      document.body.appendChild(v);
      return v;
    })();
    
    const seek = document.getElementById('seek');
    const timeEl = document.getElementById('time');
    const btnPlay = document.getElementById('btnPlay');
    const btnPause = document.getElementById('btnPause');
    const controls = document.getElementById('controls');
    const statusEl = document.getElementById('status');
    const enterARBtn = document.getElementById('enter-ar-btn');
    const cameraVideo = document.getElementById('camera-video');
    const canvas = document.getElementById('canvas');

    function log(msg) {
      console.log('[AR]', msg);
      statusEl.textContent = msg;
    }

    // Video controls
    videoEl.addEventListener('loadedmetadata', () => { 
      seek.max = videoEl.duration; 
      log('Vidéo chargée: ' + videoEl.videoWidth + 'x' + videoEl.videoHeight + ' ' + videoEl.duration.toFixed(1) + 's');
    });
    videoEl.addEventListener('canplay', () => log('Vidéo prête (canplay)'));
    videoEl.addEventListener('play', () => log('Vidéo play'));
    videoEl.addEventListener('error', (e) => log('Erreur vidéo: ' + (videoEl.error?.code || '?') + ' ' + (videoEl.error?.message || '')));
    videoEl.addEventListener('timeupdate', () => {
      seek.value = videoEl.currentTime;
      const c = videoEl.currentTime, d = videoEl.duration;
      timeEl.textContent = `${Math.floor(c/60)}:${String(Math.floor(c)%60).padStart(2,'0')} / ${Math.floor(d/60)}:${String(Math.floor(d)%60).padStart(2,'0')}`;
      btnPlay.style.display = videoEl.paused ? 'block' : 'none';
      btnPause.style.display = videoEl.paused ? 'none' : 'block';
    });

    // Three.js scene for 360° sphere
    let renderer, scene3d, camera, sphere, videoTexture;
    let isARMode = false;
    let useWebXR = false;
    let animationId;

    function initThreeJS() {
      renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.xr.enabled = true;

      scene3d = new THREE.Scene();
      
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 0);

      // Video texture
      videoTexture = new THREE.VideoTexture(videoEl);
      videoTexture.colorSpace = THREE.SRGBColorSpace;
      videoTexture.minFilter = THREE.LinearFilter;
      videoTexture.magFilter = THREE.LinearFilter;

      // Sphere geometry (inside view)
      const geometry = new THREE.SphereGeometry(50, 64, 64);
      geometry.scale(-1, 1, 1); // Invert for inside view
      const material = new THREE.MeshBasicMaterial({ map: videoTexture });
      sphere = new THREE.Mesh(geometry, material);
      scene3d.add(sphere);

      // Handle resize
      window.addEventListener('resize', onResize);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Device orientation controls (gyroscope)
    let alpha = 0, beta = 0, gamma = 0;
    let orientationEnabled = false;

    function onDeviceOrientation(e) {
      if (!orientationEnabled) return;
      // iOS Safari uses webkitCompassHeading for alpha
      alpha = e.alpha ? THREE.MathUtils.degToRad(e.alpha) : 0;
      beta = e.beta ? THREE.MathUtils.degToRad(e.beta) : 0;
      gamma = e.gamma ? THREE.MathUtils.degToRad(e.gamma) : 0;
    }

    function enableOrientation() {
      if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
        // iOS 13+
        DeviceOrientationEvent.requestPermission().then(state => {
          if (state === 'granted') {
            window.addEventListener('deviceorientation', onDeviceOrientation);
            orientationEnabled = true;
            log('Gyroscope activé (iOS)');
          }
        }).catch(() => log('Permission gyroscope refusée'));
      } else {
        // Android / others
        window.addEventListener('deviceorientation', onDeviceOrientation);
        orientationEnabled = true;
        log('Gyroscope activé');
      }
    }

    function updateCameraFromOrientation() {
      if (!orientationEnabled) return;
      // Create quaternion from device orientation
      const q = new THREE.Quaternion();
      q.setFromEuler(new THREE.Euler(-beta, -alpha, -gamma, 'YXZ'));
      camera.quaternion.slerp(q, 0.1);
    }

    // Touch/drag fallback for devices without gyroscope
    let isDragging = false, lastX = 0, lastY = 0, targetRotation = new THREE.Euler(0, 0, 0, 'YXZ');
    
    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
      }
    });
    canvas.addEventListener('touchmove', (e) => {
      if (!isDragging || e.touches.length !== 1) return;
      const dx = e.touches[0].clientX - lastX;
      const dy = e.touches[0].clientY - lastY;
      targetRotation.y -= dx * 0.005;
      targetRotation.x -= dy * 0.005;
      targetRotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, targetRotation.x));
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
    });
    canvas.addEventListener('touchend', () => { isDragging = false; });
    canvas.addEventListener('mousedown', (e) => { isDragging = true; lastX = e.clientX; lastY = e.clientY; });
    canvas.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      targetRotation.y -= dx * 0.005;
      targetRotation.x -= dy * 0.005;
      targetRotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, targetRotation.x));
      lastX = e.clientX; lastY = e.clientY;
    });
    canvas.addEventListener('mouseup', () => { isDragging = false; });

    function updateCameraFromTouch() {
      if (!orientationEnabled && !isDragging) {
        camera.quaternion.slerp(new THREE.Quaternion().setFromEuler(targetRotation), 0.05);
      }
    }

    // Camera stream (for fallback AR)
    async function startCameraStream() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } 
        });
        cameraVideo.srcObject = stream;
        await cameraVideo.play();
        cameraVideo.style.display = 'block';
        log('Caméra arrière activée');
        return true;
      } catch (e) {
        log('Caméra non accessible: ' + e.message);
        return false;
      }
    }

    // WebXR AR session
    async function startWebXR() {
      if (!navigator.xr) return false;
      const supported = await navigator.xr.isSessionSupported('immersive-ar');
      if (!supported) return false;
      
      try {
        const session = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['local-floor'],
          optionalFeatures: ['hit-test', 'dom-overlay'],
          domOverlay: { root: document.body }
        });
        
        renderer.xr.setSession(session);
        useWebXR = true;
        isARMode = true;
        enterARBtn.style.display = 'none';
        cameraVideo.style.display = 'none';
        orientationEnabled = false;
        log('WebXR AR démarré ✓');
        return true;
      } catch (e) {
        log('WebXR AR échoué: ' + e.message);
        return false;
      }
    }

    // Fallback AR: camera + gyroscope
    async function startFallbackAR() {
      log('Démarrage mode AR fallback (caméra + gyroscope)...');
      const camOk = await startCameraStream();
      if (!camOk) return false;
      
      enableOrientation();
      isARMode = true;
      enterARBtn.style.display = 'none';
      log('Mode AR fallback actif');
      return true;
    }

    // Main enter AR handler
    enterARBtn.addEventListener('click', async () => {
      enterARBtn.disabled = true;
      enterARBtn.textContent = 'Chargement...';
      
      // Try WebXR first
      const webxrOk = await startWebXR();
      if (!webxrOk) {
        // Fallback to camera + gyroscope
        await startFallbackAR();
      }
      enterARBtn.disabled = false;
      enterARBtn.textContent = 'Entrer en AR';
    });

    // Animation loop
    function animate() {
      animationId = requestAnimationFrame(animate);
      
      if (useWebXR) {
        // WebXR handles camera automatically
        renderer.render(scene3d, camera);
      } else if (isARMode) {
        // Fallback AR: update camera from gyroscope/touch
        updateCameraFromOrientation();
        updateCameraFromTouch();
        
        // Render sphere over camera video
        renderer.render(scene3d, camera);
      } else {
        // Normal 360° mode (no camera)
        updateCameraFromTouch();
        renderer.render(scene3d, camera);
      }
    }

    // Initialize everything
    async function init() {
      initThreeJS();
      
      // Check WebXR support
      if (navigator.xr) {
        const supported = await navigator.xr.isSessionSupported('immersive-ar');
        log('WebXR AR: ' + (supported ? 'SUPPORTÉ ✓' : 'NON SUPPORTÉ → fallback caméra+gyro'));
        if (supported) enterARBtn.style.display = 'block';
      } else {
        log('WebXR non disponible → fallback caméra+gyro');
      }
      
      // Start video
      videoEl.load();
      videoEl.play().catch(e => log('Autoplay bloqué: ' + e.message));
      
      // Start render loop
      animate();
    }

    init();
  </script>
</body>
</html>
