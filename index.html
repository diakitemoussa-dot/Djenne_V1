<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Djenné 360° - Gyroscopique</title>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160/build/three.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { overflow:hidden; background:#000; touch-action:none; }
    #canvas { position:fixed; top:0; left=0; width:100vw; height:100vh; display:block; }
    #camera-video { position:fixed; top:0; left:0; width:100vw; height:100vh; object-fit:cover; z-index:1; display:none; }
    #controls { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:10; display:flex; gap:8px; align-items:center; background:rgba(0,0,0,0.7); padding:10px 15px; border-radius:30px; color:white; font-family:system-ui; }
    #controls button { background:#fff; border:none; border-radius:50%; width:40px; height:40px; font-size:18px; cursor:pointer; }
    #seek { width:180px; accent-color:#fff; }
    #time { font-size:12px; min-width:70px; text-align:center; }
    #status { position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:10; background:rgba(0,0,0,0.8); color:#0f0; padding:10px 15px; border-radius:8px; font-family:monospace; font-size:12px; max-width:90%; text-align:center; }
    #mode-toggle { position:fixed; top:20px; right:20px; z-index:10; background:rgba(0,0,0,0.7); color:white; border:none; padding:8px 12px; border-radius:20px; font-size:12px; cursor:pointer; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <video id="camera-video" playsinline muted></video>
  
  <div id="status"></div>
  <button id="mode-toggle">Mode: 360° Gyro</button>
  
  <div id="controls">
    <button id="btnPlay" onclick="videoEl.play()">▶</button>
    <button id="btnPause" onclick="videoEl.pause()">⏸</button>
    <button onclick="videoEl.currentTime=0; videoEl.play()">⏮</button>
    <input type="range" id="seek" min="0" max="60" step="1" value="0" oninput="videoEl.currentTime=this.value">
    <span id="time">0:00 / 1:00</span>
  </div>

  <script>
    const videoEl = document.createElement('video');
    videoEl.id = 'video360';
    videoEl.src = 'video.mp4';
    videoEl.poster = 'poster.jpg';
    videoEl.loop = true;
    videoEl.muted = true;
    videoEl.playsInline = true;
    videoEl.crossOrigin = 'anonymous';
    videoEl.preload = 'metadata';
    document.body.appendChild(videoEl);

    const seek = document.getElementById('seek');
    const timeEl = document.getElementById('time');
    const btnPlay = document.getElementById('btnPlay');
    const btnPause = document.getElementById('btnPause');
    const statusEl = document.getElementById('status');
    const modeToggle = document.getElementById('mode-toggle');
    const cameraVideo = document.getElementById('camera-video');
    const canvas = document.getElementById('canvas');

    function log(msg) {
      console.log('[GYRO]', msg);
      statusEl.textContent = msg;
      setTimeout(() => { if (statusEl.textContent === msg) statusEl.textContent = ''; }, 4000);
    }

    // Video controls
    videoEl.addEventListener('loadedmetadata', () => { 
      seek.max = videoEl.duration; 
      log('Vidéo: ' + videoEl.videoWidth + 'x' + videoEl.videoHeight + ' ' + videoEl.duration.toFixed(1) + 's');
    });
    videoEl.addEventListener('canplay', () => log('Vidéo prête'));
    videoEl.addEventListener('play', () => log('Lecture'));
    videoEl.addEventListener('error', () => log('Erreur vidéo: ' + (videoEl.error?.code || '?')));
    videoEl.addEventListener('timeupdate', () => {
      seek.value = videoEl.currentTime;
      const c = videoEl.currentTime, d = videoEl.duration;
      timeEl.textContent = `${Math.floor(c/60)}:${String(Math.floor(c)%60).padStart(2,'0')} / ${Math.floor(d/60)}:${String(Math.floor(d)%60).padStart(2,'0')}`;
      btnPlay.style.display = videoEl.paused ? 'block' : 'none';
      btnPause.style.display = videoEl.paused ? 'none' : 'block';
    });

    // Three.js scene
    let renderer, scene3d, camera, sphere, videoTexture;
    let useCamera = false;
    let orientationEnabled = false;
    let alpha = 0, beta = 0, gamma = 0;
    let targetQuat = new THREE.Quaternion();
    let currentQuat = new THREE.Quaternion();
    let animationId;

    // Touch/drag fallback
    let isDragging = false, lastX = 0, lastY = 0;
    let dragTarget = new THREE.Euler(0, 0, 0, 'YXZ');

    function initThreeJS() {
      renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      scene3d = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 0);

      videoTexture = new THREE.VideoTexture(videoEl);
      videoTexture.colorSpace = THREE.SRGBColorSpace;
      videoTexture.minFilter = THREE.LinearFilter;
      videoTexture.magFilter = THREE.LinearFilter;

      const geometry = new THREE.SphereGeometry(50, 64, 64);
      geometry.scale(-1, 1, 1);
      const material = new THREE.MeshBasicMaterial({ map: videoTexture, transparent: true, opacity: useCamera ? 0.9 : 1.0 });
      sphere = new THREE.Mesh(geometry, material);
      scene3d.add(sphere);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    // Gyroscope handling
    function onDeviceOrientation(e) {
      if (!orientationEnabled) return;
      // Standard: alpha (Z), beta (X), gamma (Y)
      // Convert to THREE quaternion (YXZ order for mobile)
      const q = new THREE.Quaternion();
      q.setFromEuler(new THREE.Euler(
        -THREE.MathUtils.degToRad(e.beta || 0),
        -THREE.MathUtils.degToRad(e.alpha || 0),
        -THREE.MathUtils.degToRad(e.gamma || 0),
        'YXZ'
      ));
      targetQuat.copy(q);
    }

    function enableGyroscope() {
      if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
        // iOS 13+
        DeviceOrientationEvent.requestPermission().then(state => {
          if (state === 'granted') {
            window.addEventListener('deviceorientation', onDeviceOrientation);
            orientationEnabled = true;
            log('Gyroscope activé (iOS)');
          } else {
            log('Permission gyroscope refusée → mode tactile');
          }
        }).catch(() => log('Erreur permission gyroscope'));
      } else {
        // Android / others
        window.addEventListener('deviceorientation', onDeviceOrientation);
        orientationEnabled = true;
        log('Gyroscope activé');
      }
    }

    // Touch/drag fallback
    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
        e.preventDefault();
      }
    }, { passive: false });
    
    canvas.addEventListener('touchmove', (e) => {
      if (!isDragging || e.touches.length !== 1) return;
      const dx = e.touches[0].clientX - lastX;
      const dy = e.touches[0].clientY - lastY;
      dragTarget.y -= dx * 0.005;
      dragTarget.x -= dy * 0.005;
      dragTarget.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, dragTarget.x));
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
      e.preventDefault();
    }, { passive: false });
    
    canvas.addEventListener('touchend', () => { isDragging = false; });
    canvas.addEventListener('mousedown', (e) => { isDragging = true; lastX = e.clientX; lastY = e.clientY; });
    canvas.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      dragTarget.y -= dx * 0.005;
      dragTarget.x -= dy * 0.005;
      dragTarget.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, dragTarget.x));
      lastX = e.clientX; lastY = e.clientY;
    });
    canvas.addEventListener('mouseup', () => { isDragging = false; });

    function updateCamera() {
      if (orientationEnabled) {
        // Smooth slerp to gyroscope target
        currentQuat.slerp(targetQuat, 0.1);
        camera.quaternion.copy(currentQuat);
      } else if (!useCamera) {
        // Touch/drag fallback only in non-camera mode
        const dragQuat = new THREE.Quaternion().setFromEuler(dragTarget);
        currentQuat.slerp(dragQuat, 0.05);
        camera.quaternion.copy(currentQuat);
      }
      // In camera mode, gyroscope always controls (no touch fallback needed)
    }

    // Camera stream
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } 
        });
        cameraVideo.srcObject = stream;
        await cameraVideo.play();
        cameraVideo.style.display = 'block';
        sphere.material.opacity = 0.85;
        useCamera = true;
        modeToggle.textContent = 'Mode: AR Caméra+Gyro';
        log('Caméra arrière activée');
        return true;
      } catch (e) {
        log('Caméra inaccessible: ' + e.message);
        return false;
      }
    }

    function stopCamera() {
      if (cameraVideo.srcObject) {
        cameraVideo.srcObject.getTracks().forEach(t => t.stop());
        cameraVideo.srcObject = null;
      }
      cameraVideo.style.display = 'none';
      sphere.material.opacity = 1.0;
      useCamera = false;
      modeToggle.textContent = 'Mode: 360° Gyro';
      log('Caméra arrêtée');
    }

    modeToggle.addEventListener('click', async () => {
      if (useCamera) {
        stopCamera();
      } else {
        await startCamera();
      }
    });

    // Animation loop
    function animate() {
      animationId = requestAnimationFrame(animate);
      updateCamera();
      renderer.render(scene3d, camera);
    }

    // Init
    async function init() {
      initThreeJS();
      enableGyroscope();
      videoEl.load();
      videoEl.play().catch(() => log('Touchez l\'écran pour démarrer'));
      animate();
      log('Prêt - Bougez le téléphone pour regarder');
    }

    init();
  </script>
</body>
</html>
